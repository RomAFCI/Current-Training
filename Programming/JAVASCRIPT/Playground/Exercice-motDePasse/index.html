<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="style.css" rel="stylesheet" />
    <link href="reset.css" rel="stylesheet">
  </head>
  <body class="flexColumn">
    <form class="flexColumn">
        <h1>Password Generator</h1>
        <div class="flexRow">
            <input type="range" class="range" name="range" value="10" min="6" max="14" />
            <p class="info"></p>
        </div>
      <div class="flexRow">
        <div class="miniBox min"><p>a-z</p></div>
        <div class="miniBox maj"><p>A-Z</p></div>
        <div class="miniBox nbr"><p>1-9</p></div>
        <div class="miniBox car"><p>-*"</p></div>
      </div>
      <input type="submit" />
    </form>
    <script src="js.js"></script>
  </body>
</html>
