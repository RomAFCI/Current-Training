<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="style.css" rel="stylesheet" />
    <link href="reset.css" rel="stylesheet" />
  </head>
  <body class="flexColumn">
    <form class="flexColumn">
      <h1>Password Generator</h1>
      <div class="flexRow">
        <input
          type="range"
          class="range"
          name="range"
          value=""
          min="6"
          max="14"
        />
        <p class="info">10</p>
      </div>
      <div class="flexRow checkboxContainer">
        <div class="flexColumnBox">
          <input type="checkbox" id="lowercase" class="min boxChecked" />
          <label class="bubble" for="lowercase">a-z</label>
        </div>

        <div class="flexColumnBox">
          <input type="checkbox" id="uppercase" class="maj boxChecked" />
          <label class="bubble" for="uppercase">A-Z</label>
        </div>

        <div class="flexColumnBox">
          <input type="checkbox" id="numbers" class="nbr boxChecked" />
          <label class="bubble" for="numbers">0-9</label>
        </div>
        <div class="flexColumnBox">
          <input type="checkbox" id="symbols" class="sym boxChecked" />
          <label class="bubble" for="symbols">!-?</label>
        </div>
      </div>
      <input class="btnSubmit" type="submit" />
    </form>
    <div class="annoucement">ddd</div>
    <script src="js.js"></script>
  </body>
</html>
